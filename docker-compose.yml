version: "3.8"

services:
  # ---------------------------------------------------------------------------
  # 1. PostgreSQL Database Service (Persistent Catalog & User Data)
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: restaurant_postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-restaurant_recommender}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-restaurant_recommender}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - recommender_net
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # 2. Redis Distributed Cache (Shared Across Multi-Node Deployments)
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: restaurant_redis
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
    networks:
      - recommender_net
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # 3. FastAPI Production Recommendation Backend (Gunicorn + Uvicorn Workers)
  # ---------------------------------------------------------------------------
  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    container_name: restaurant_api
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      APP_ENV: production
      HOST: "0.0.0.0"
      PORT: 8000
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-restaurant_recommender}
      CACHE_BACKEND: redis
      REDIS_URL: redis://redis:6379/0
      RECOMMENDATION_CACHE_ENABLED: "true"
      RECOMMENDATION_CACHE_TTL_SECONDS: 300
      RECOMMENDATION_CACHE_MAX_SIZE: 1000
      THREAD_POOL_WORKERS: 8
      DEFAULT_MMR_LAMBDA: 0.75
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 25s
    networks:
      - recommender_net
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # 4. Streamlit Interactive Presentation Layer
  # ---------------------------------------------------------------------------
  streamlit:
    build:
      context: .
      dockerfile: docker/Dockerfile.streamlit
    container_name: restaurant_streamlit
    depends_on:
      api:
        condition: service_healthy
    environment:
      STREAMLIT_API_BASE_URL: http://api:8000
      STREAMLIT_SERVER_PORT: 8501
      STREAMLIT_SERVER_ADDRESS: "0.0.0.0"
    ports:
      - "8501:8501"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8501/_stcore/health')\""]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - recommender_net
    restart: unless-stopped

# -----------------------------------------------------------------------------
# Volumes & Networks
# -----------------------------------------------------------------------------
volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  recommender_net:
    driver: bridge

